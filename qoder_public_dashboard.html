<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>qoder2api-public 管理</title>
<style>
:root{color-scheme:light;--bg:#f5f7fa;--fg:#19252d;--muted:#60717c;--line:#d6e0e5;--accent:#087f6d;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}header{background:#fff;border-bottom:1px solid var(--line);padding:16px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}h1{font-size:19px;margin:0}nav{display:flex;gap:4px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--fg);padding:8px 12px;cursor:pointer;min-height:38px}button:hover{background:#edf4f3}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--danger)}button:disabled{opacity:.5;cursor:wait}main{max-width:1400px;margin:auto;padding:24px}section{display:none}section.active{display:block}h2{font-size:17px;margin:0 0 16px}h3{font-size:14px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}.stat{border:1px solid var(--line);border-radius:8px;background:#fff;padding:16px}.stat b{font-size:22px;display:block}.muted{color:var(--muted)}.table-wrap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{background:#f0f4f6;font-weight:600;white-space:nowrap}td.actions{white-space:nowrap}input,select,textarea{font:inherit;color:inherit;border:1px solid #b7c6cf;border-radius:5px;padding:8px;background:#fff;max-width:100%}input[type=checkbox]{width:18px;height:18px}label{display:grid;gap:5px;margin-bottom:12px}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}form{max-width:900px}dialog{border:1px solid var(--line);border-radius:8px;padding:24px;max-width:min(600px,90vw);width:100%}dialog::backdrop{background:#17252dcc}.secret{font:16px/1.6 ui-monospace,Consolas,monospace;word-break:break-all;padding:14px;background:#fff;border:1px solid var(--line);user-select:all}#message{min-height:24px;margin:12px 0;color:var(--danger);white-space:pre-wrap}#login{max-width:380px;margin:15vh auto;background:#fff;border:1px solid var(--line);border-radius:8px;padding:28px}#app[hidden],#login[hidden]{display:none}.pill{font-size:12px;padding:2px 6px;border-radius:4px;background:#e4f4ef;color:#126353}.pill.off{background:#fee4e2;color:var(--danger)}select[multiple]{min-height:100px;width:100%}@media(max-width:650px){main{padding:14px}header{padding:12px 14px;gap:10px}nav{order:3;width:100%}.toolbar{align-items:stretch}.toolbar>*{max-width:100%}}
</style>
</head>
<body>
<form id="login"><h1>本机管理</h1><p class="muted">qoder2api-public</p><label>管理密码<input id="password" type="password" autocomplete="current-password" required autofocus></label><button class="primary" type="submit">登录</button><p id="login-error" role="alert"></p></form>
<div id="app" hidden><header><h1>qoder2api-public</h1><nav aria-label="管理视图"><button data-view="keys">API Keys</button><button data-view="usage">用量</button><button data-view="audit">流水</button><button data-view="status">状态</button></nav><button id="logout" type="button">退出</button></header><main><div id="message" role="status"></div>
<section id="keys" class="active"><div class="toolbar"><h2>API Keys</h2><button id="new-key" class="primary">新建 Key</button><button data-refresh="keys">刷新</button></div><div class="table-wrap"><table><thead><tr><th>名称 / ID</th><th>Key 前缀</th><th>状态</th><th>策略</th><th>有效期</th><th>操作</th></tr></thead><tbody id="key-rows"></tbody></table></div></section>
<section id="usage"><div class="toolbar"><h2>用量与配额</h2><select id="usage-days" aria-label="统计天数"><option value="7">7 天</option><option value="30">30 天</option><option value="1">今日</option></select><button data-refresh="usage">刷新</button></div><div id="usage-content"></div></section>
<section id="audit"><div class="toolbar"><h2>最近请求</h2><select id="audit-key" aria-label="按 Key 过滤"></select><button data-refresh="audit">刷新</button></div><div class="table-wrap"><table><thead><tr><th>时间</th><th>Key</th><th>模型</th><th>状态</th><th>输入 / 输出 tokens</th><th>耗时</th><th>错误</th></tr></thead><tbody id="audit-rows"></tbody></table></div></section>
<section id="status"><h2>运行状态</h2><div id="status-grid" class="grid"></div><h3>隧道</h3><pre id="tunnel-status"></pre><h3>可用模型</h3><div id="model-list"></div></section>
</main></div>
<dialog id="edit-dialog"><form id="edit-form"><h2 id="edit-title">新建 Key</h2><input id="edit-id" type="hidden"><div class="form-grid"><label>名称<input id="f-name" required maxlength="64"></label><label>所有者<input id="f-owner" maxlength="64"></label><label>每分钟请求数<input id="f-rpm" type="number" min="1" max="10000" placeholder="60"></label><label>最大并发<input id="f-max" type="number" min="1" max="100" placeholder="4"></label><label>日 token 配额（0 不限）<input id="f-daily" type="number" min="0" placeholder="0"></label><label>月 token 配额（0 不限）<input id="f-monthly" type="number" min="0" placeholder="0"></label><label>有效期（留空不限）<input id="f-expiry" type="datetime-local"></label><label>区域<select id="f-realm"><option value="">默认</option><option value="cn">cn</option><option value="intl">intl</option></select></label></div><label>模型白名单（逗号分隔，空为不限）<input id="f-models"></label><label>IP/CIDR 白名单（逗号分隔，空为不限）<input id="f-ips"></label><label>备注<textarea id="f-note" rows="2" maxlength="500"></textarea></label><div class="toolbar"><button class="primary" type="submit">保存</button><button type="button" data-close>取消</button></div></form></dialog>
<dialog id="secret-dialog"><h2>立即保存 API Key</h2><p>密钥不会再次显示。</p><div id="secret" class="secret"></div><button id="copy-secret" type="button">复制</button> <button type="button" data-close>我已保存</button></dialog>
<script nonce="__CSP_NONCE__">
'use strict';
let csrf='', active='keys';
const $=id=>document.getElementById(id);
function node(tag,text){const el=document.createElement(tag);if(text!==undefined)el.textContent=String(text);return el;}
function message(text){$('message').textContent=text||'';}
async function api(path,options={}){const headers={'Accept':'application/json','X-Requested-With':'qdp-admin'};if(options.body){headers['Content-Type']='application/json';options.body=JSON.stringify(options.body);}if(options.method&&options.method!=='GET'){headers['X-QDP-CSRF']=csrf;}$('message').textContent='';const response=await fetch(path,{...options,headers,credentials:'same-origin'});let data={};try{data=await response.json();}catch(e){}if(!response.ok){if(response.status===401){showLogin();}throw new Error(data.error?.message||`请求失败 (${response.status})`);}return data;}
function showLogin(){$('app').hidden=true;$('login').hidden=false;csrf='';}
function showApp(){$('login').hidden=true;$('app').hidden=false;load('keys');}
function button(text,action,kind=''){const el=node('button',text);el.type='button';el.className=kind;el.addEventListener('click',action);return el;}
async function mutate(method,path){try{const result=await api(path,{method});if(result.secret){$('secret').textContent=result.secret;$('secret-dialog').showModal();}await load('keys');}catch(e){message(e.message);}}
async function loadKeys(){const {keys}=await api('/api/keys');const body=$('key-rows');body.replaceChildren();$('audit-key').replaceChildren(node('option','全部 Key'));for(const key of keys){const row=node('tr');const title=node('td');title.append(node('strong',key.name),document.createElement('br'),node('span',key.id));title.lastChild.className='muted';row.append(title,node('td',key.prefix));const state=node('td');state.append(node('span',key.enabled?'启用':'禁用'));state.firstChild.className='pill'+(key.enabled?'':' off');row.append(state);row.append(node('td',`${key.rpm} RPM / ${key.max_concurrent} 并发\n${key.daily_tokens||'不限'} 日 / ${key.monthly_tokens||'不限'} 月 tokens`));row.append(node('td',key.expires_at||'永不过期'));const actions=node('td');actions.className='actions';actions.append(button('编辑',()=>openEdit(key)),button(key.enabled?'禁用':'启用',()=>mutate('POST',`/api/keys/${encodeURIComponent(key.id)}/${key.enabled?'disable':'enable'}`)),button('轮换',()=>{if(confirm('轮换后旧 Key 立即失效，继续？'))mutate('POST',`/api/keys/${encodeURIComponent(key.id)}/rotate`);}),button('删除',()=>{if(confirm('确认软删除此 Key？'))mutate('DELETE',`/api/keys/${encodeURIComponent(key.id)}`);},'danger'));row.append(actions);body.append(row);const option=node('option',key.name);option.value=key.id;$('audit-key').append(option);}}
function openEdit(key){$('edit-title').textContent=key?'编辑 Key':'新建 Key';$('edit-id').value=key?.id||'';$('f-name').value=key?.name||'';$('f-owner').value=key?.owner||'';$('f-rpm').value=key?.rpm??'';$('f-max').value=key?.max_concurrent??'';$('f-daily').value=key?.daily_tokens??'';$('f-monthly').value=key?.monthly_tokens??'';$('f-expiry').value=key?.expires_at?key.expires_at.slice(0,16):'';$('f-realm').value=key?.realm||'';$('f-models').value=(key?.allowed_models||[]).join(', ');$('f-ips').value=(key?.allowed_ips||[]).join(', ');$('f-note').value=key?.note||'';$('edit-dialog').showModal();}
async function loadUsage(){const data=await api(`/api/usage?days=${encodeURIComponent($('usage-days').value)}`);const root=$('usage-content');root.replaceChildren();const wrap=node('div');wrap.className='table-wrap';const table=node('table');const head=node('tr');for(const title of ['Key','请求 / 错误','输入 tokens','输出 tokens','今日 / 本月已用','配额剩余','最后使用'])head.append(node('th',title));const thead=node('thead');thead.append(head);table.append(thead);const body=node('tbody');for(const row of data.summary){const quota=data.quotas[row.key_id]||{};const tr=node('tr');for(const value of [row.name||row.key_id,`${row.requests} / ${row.errors}`,row.prompt_tokens,row.completion_tokens,`${quota.day_tokens??0} / ${quota.month_tokens??0}`,`${quota.daily_remaining??'不限'} / ${quota.monthly_remaining??'不限'}`,row.last_at||'-'])tr.append(node('td',value));body.append(tr);}table.append(body);wrap.append(table);root.append(wrap);root.append(node('h3','逐日合计'));const daily=node('pre');daily.textContent=JSON.stringify(data.daily,null,2);root.append(daily);}
async function loadAudit(){const data=await api(`/api/audit?limit=100&key_id=${encodeURIComponent($('audit-key').value)}`);const body=$('audit-rows');body.replaceChildren();for(const row of data.rows){const tr=node('tr');for(const value of [row.ts,row.key_id,row.model,row.status,`${row.prompt_tokens||0} / ${row.completion_tokens||0}`,`${row.ms||0} ms`,row.err||'-'])tr.append(node('td',value??'-'));body.append(tr);}}
async function loadStatus(){const data=await api('/api/status');const grid=$('status-grid');grid.replaceChildren();for(const [label,value] of [['网关',data.gateway],['Keys',data.keys],['今日请求',data.today_requests],['今日失败',data.today_errors],['上游',data.upstream.ok?'正常':data.upstream.message||'异常']]){const card=node('div');card.className='stat';card.append(node('span',label),node('b',value));grid.append(card);}const tunnel=await api('/api/tunnel');$('tunnel-status').textContent=JSON.stringify(tunnel,null,2);const models=await api('/api/models');const list=$('model-list');list.replaceChildren();for(const model of models.models)list.append(node('span',model.id+' '));}
async function load(view){active=view;for(const el of document.querySelectorAll('section'))el.classList.toggle('active',el.id===view);try{if(view==='keys')await loadKeys();else if(view==='usage')await loadUsage();else if(view==='audit'){await loadKeys();await loadAudit();}else await loadStatus();}catch(e){message(e.message);}}
$('login').addEventListener('submit',async event=>{event.preventDefault();$('login-error').textContent='';try{const data=await api('/api/login',{method:'POST',body:{password:$('password').value}});csrf=data.csrf;$('password').value='';showApp();}catch(e){$('login-error').textContent=e.message;}});
$('logout').addEventListener('click',async()=>{try{await api('/api/logout',{method:'POST'});}finally{showLogin();}});
for(const el of document.querySelectorAll('[data-view]'))el.addEventListener('click',()=>load(el.dataset.view));
for(const el of document.querySelectorAll('[data-refresh]'))el.addEventListener('click',()=>load(el.dataset.refresh));
for(const el of document.querySelectorAll('[data-close]'))el.addEventListener('click',()=>el.closest('dialog').close());
$('secret-dialog').addEventListener('close',()=>$('secret').textContent='');
$('new-key').addEventListener('click',()=>openEdit());
$('usage-days').addEventListener('change',loadUsage);
$('audit-key').addEventListener('change',loadAudit);
$('edit-form').addEventListener('submit',async event=>{event.preventDefault();const id=$('edit-id').value;const number=(id,field)=>{if($(id).value!=='')payload[field]=Number($(id).value);};const payload={name:$('f-name').value,owner:$('f-owner').value,note:$('f-note').value,realm:$('f-realm').value,allowed_models:$('f-models').value.split(',').map(x=>x.trim()).filter(Boolean),allowed_ips:$('f-ips').value.split(',').map(x=>x.trim()).filter(Boolean)};number('f-rpm','rpm');number('f-max','max_concurrent');number('f-daily','daily_tokens');number('f-monthly','monthly_tokens');if($('f-expiry').value)payload.expires_at=new Date($('f-expiry').value).toISOString();else if(id)payload.expires_at=null;try{const result=await api(id?`/api/keys/${encodeURIComponent(id)}`:'/api/keys',{method:id?'PATCH':'POST',body:payload});$('edit-dialog').close();if(result.secret){$('secret').textContent=result.secret;$('secret-dialog').showModal();}await loadKeys();}catch(e){message(e.message);}});
$('copy-secret').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('secret').textContent);}catch(e){message('自动复制失败，请手动选择密钥复制。');}});
</script></body></html>
